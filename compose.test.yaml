services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: unios
      POSTGRES_PASSWORD: unios_test_password
      POSTGRES_DB: unios_test
    ports:
      - "127.0.0.1:54323:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unios -d unios_test"]
      interval: 2s
      timeout: 2s
      retries: 20
